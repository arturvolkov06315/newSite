<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание — OCR загрузка</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #ffe9f4 0%, #ffe0ed 100%);
            font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
            min-height: 100vh;
            padding: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        .upload-card {
            background: #fcf5f8;
            border-radius: 32px;
            padding: 1.2rem 1rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 6px 24px rgba(235, 120, 160, 0.12);
            border: 1px solid rgba(255, 220, 235, 0.5);
        }

        .upload-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px dashed #ffdce8;
        }

        .upload-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #8f4b6b;
        }

        .upload-header .hint-text {
            font-size: 0.65rem;
            color: #95486b;
            background: #ffd9e6;
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            border: 1px solid #ffb3cb;
            white-space: nowrap;
        }

        .upload-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }

        .upload-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            background: #fff3f7;
            border: 2px dashed #ffbdd2;
            border-radius: 24px;
            padding: 1rem 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #712f4b;
            font-size: 0.8rem;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            min-height: 80px;
        }

        .upload-btn:active {
            transform: scale(0.96);
            background: #ffeef3;
        }

        .upload-btn .icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .upload-btn .label {
            font-size: 0.7rem;
            text-align: center;
            opacity: 0.8;
        }

        .upload-btn input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
        }

        .upload-btn.camera {
            background: #ffd9e6;
            border-color: #ffb0c8;
        }

        .upload-btn.gallery {
            background: #fce4ed;
            border-color: #ffc0d0;
        }

        .preview-container {
            margin-top: 0.8rem;
            display: none;
        }

        .preview-container.active {
            display: block;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 16px;
            border: 2px solid #ffdce8;
            display: block;
            margin: 0 auto;
        }

        .progress-container {
            margin-top: 0.8rem;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ffdce8;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #ffbdd2;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fbc4d0, #ffb0c8);
            border-radius: 20px;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            font-size: 0.8rem;
            color: #95486b;
            margin-top: 0.3rem;
        }

        .actions-row {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #ffb3cb;
            text-align: center;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #ffbdd2;
            border-color: #ffb0c8;
            color: #582f41;
        }

        .btn-primary:active {
            background: #ffb0c8;
        }

        .btn-danger {
            background: #ffd9e6;
            border-color: #ffbdd2;
            color: #712f4b;
        }

        .btn-danger:active {
            background: #ffc8d8;
        }

        .btn-success {
            background: #d4e8d4;
            border-color: #b8d4b8;
            color: #3a6a3a;
        }

        .btn-success:active {
            background: #c0dcc0;
        }

        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .schedule-card {
            background: #fcf5f8;
            border-radius: 32px;
            padding: 1.2rem 1rem;
            box-shadow: 0 6px 24px rgba(235, 120, 160, 0.12);
            border: 1px solid rgba(255, 220, 235, 0.5);
            display: block;
            margin-top: 1.2rem;
        }

        .schedule-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px dashed #ffdce8;
        }

        .schedule-header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #8f4b6b;
        }

        .schedule-header .group-name {
            background: #ffd9e6;
            color: #783f5b;
            font-weight: 500;
            padding: 0.15rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            border: 1px solid #ffb3cb;
        }

        .schedule-header .count-badge {
            background: #fbc4d0;
            color: #582f41;
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            font-size: 0.65rem;
            border: 1px solid #ffb3cb;
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: 24px;
            background: rgba(255, 240, 245, 0.3);
            padding: 0.1rem;
            border: 1px solid rgba(255, 220, 235, 0.3);
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            background: transparent;
            min-width: 500px;
        }

        th {
            background: #fbc4d0;
            color: #582f41;
            font-weight: 600;
            padding: 0.6rem 0.4rem;
            text-align: center;
            border-bottom: 2px solid #ffb0c8;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        th:first-child {
            border-radius: 16px 0 0 0;
        }
        th:last-child {
            border-radius: 0 16px 0 0;
        }

        td {
            background: #fcf7f9;
            padding: 0.5rem 0.3rem;
            text-align: center;
            border-bottom: 1px solid #ffdce8;
            vertical-align: middle;
            color: #3e2a30;
            font-size: 0.7rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        td:first-child {
            font-weight: 500;
            background: #fff3f7;
            border-radius: 12px 0 0 12px;
        }

        td:last-child {
            border-radius: 0 12px 12px 0;
        }

        tr:hover td {
            background: #ffeef3;
        }

        tr:hover td:first-child {
            background: #ffdde9;
        }

        .day-cell {
            background: #ffdde9 !important;
            font-weight: 600;
            color: #712f4b;
            border-radius: 12px 0 0 12px;
            font-size: 0.75rem;
        }

        .day-cell span {
            display: inline-block;
            background: #ffffff;
            padding: 0.05rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            border: 1px solid #ffbdd2;
        }

        .pair-time {
            font-weight: 500;
            color: #56333f;
            background: #fbdae6;
            padding: 0.05rem 0.6rem;
            border-radius: 20px;
            font-size: 0.6rem;
            display: inline-block;
            border: 1px solid #ffb8cf;
            white-space: nowrap;
        }

        .subject {
            font-weight: 500;
            color: #3c2430;
            display: block;
            font-size: 0.75rem;
        }

        .teacher {
            font-weight: 400;
            color: #643e4e;
            font-size: 0.65rem;
        }

        .teacher::before {
            content: "— ";
            opacity: 0.5;
        }

        .room {
            background: #ffeef5;
            border-radius: 20px;
            padding: 0.05rem 0.7rem;
            font-size: 0.65rem;
            font-weight: 500;
            color: #95486b;
            display: inline-block;
            border: 1px solid #ffbdd2;
            min-width: 1.8rem;
        }

        .recognized-text {
            background: #fff3f7;
            border: 1px solid #ffdce8;
            border-radius: 16px;
            padding: 0.8rem;
            margin-top: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.7rem;
            color: #3e2a30;
            white-space: pre-wrap;
            display: none;
        }

        .recognized-text.active {
            display: block;
        }

        .recognized-text .label {
            font-weight: 600;
            color: #712f4b;
            margin-bottom: 0.3rem;
            font-size: 0.75rem;
        }

        .status-message {
            text-align: center;
            padding: 0.5rem;
            border-radius: 16px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .status-message.success {
            display: block;
            background: #d4e8d4;
            color: #3a6a3a;
            border: 1px solid #b8d4b8;
        }

        .status-message.error {
            display: block;
            background: #ffd9e6;
            color: #712f4b;
            border: 1px solid #ffbdd2;
        }

        .status-message.info {
            display: block;
            background: #ffd9e6;
            color: #95486b;
            border: 1px solid #ffbdd2;
        }

        .footer-actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .footer-actions .btn {
            flex: 1;
            min-width: 80px;
        }

        @media (min-width: 600px) {
            .upload-buttons {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .upload-header h2 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.4rem;
            }
            .upload-card,
            .schedule-card {
                padding: 0.8rem 0.6rem;
                border-radius: 24px;
            }
            .upload-header h2 {
                font-size: 1rem;
            }
            .upload-buttons {
                grid-template-columns: 1fr 1fr;
                gap: 0.4rem;
            }
            .upload-btn {
                min-height: 64px;
                padding: 0.6rem 0.3rem;
                border-radius: 18px;
            }
            .upload-btn .icon {
                font-size: 1.4rem;
            }
            .upload-btn .label {
                font-size: 0.6rem;
            }
            .btn {
                font-size: 0.7rem;
                padding: 0.5rem 0.6rem;
                min-height: 38px;
                border-radius: 30px;
            }
            .schedule-header h1 {
                font-size: 1.1rem;
            }
            .schedule-header .group-name {
                font-size: 0.6rem;
                padding: 0.1rem 0.6rem;
            }
            .schedule-header .count-badge {
                font-size: 0.55rem;
                padding: 0.1rem 0.5rem;
            }
            table {
                font-size: 0.65rem;
                min-width: 380px;
            }
            th {
                font-size: 0.55rem;
                padding: 0.4rem 0.25rem;
            }
            td {
                font-size: 0.6rem;
                padding: 0.35rem 0.2rem;
            }
            .subject {
                font-size: 0.65rem;
            }
            .teacher {
                font-size: 0.55rem;
            }
            .room {
                font-size: 0.55rem;
                padding: 0.05rem 0.4rem;
                min-width: 1.4rem;
            }
            .pair-time {
                font-size: 0.5rem;
                padding: 0.05rem 0.4rem;
            }
            .day-cell {
                font-size: 0.65rem;
            }
            .day-cell span {
                font-size: 0.6rem;
                padding: 0.05rem 0.5rem;
            }
        }

        @media (max-width: 380px) {
            .upload-btn {
                min-height: 54px;
                padding: 0.4rem 0.2rem;
                border-radius: 14px;
            }
            .upload-btn .icon {
                font-size: 1.2rem;
            }
            .upload-btn .label {
                font-size: 0.5rem;
            }
            table {
                font-size: 0.55rem;
                min-width: 320px;
            }
            td {
                padding: 0.25rem 0.15rem;
            }
            .subject {
                font-size: 0.55rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- КАРТОЧКА ЗАГРУЗКИ -->
        <div class="upload-card">
            <div class="upload-header">
                <h2>📋 загрузить <span style="font-weight:300;opacity:0.6;">расписание</span></h2>
                <span class="hint-text">PNG / JPG / WEBP</span>
            </div>

            <div class="upload-buttons">
                <label class="upload-btn camera">
                    <span class="icon">📸</span>
                    <span class="label">Снять фото</span>
                    <input type="file" accept="image/*" capture="environment">
                </label>
                <label class="upload-btn gallery">
                    <span class="icon">🖼️</span>
                    <span class="label">Выбрать из галереи</span>
                    <input type="file" accept="image/*">
                </label>
            </div>

            <div class="preview-container" id="previewContainer">
                <img id="previewImage" src="" alt="Предпросмотр">
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Распознавание...</div>
            </div>

            <div class="status-message" id="statusMessage"></div>

            <div class="recognized-text" id="recognizedText">
                <div class="label">📝 Распознанный текст:</div>
                <div id="textContent"></div>
            </div>

            <div class="actions-row">
                <button class="btn btn-primary" id="recognizeBtn" disabled>🔍 Распознать</button>
                <button class="btn btn-danger" id="clearBtn">🗑️ Очистить</button>
            </div>
        </div>

        <!-- КАРТОЧКА РАСПИСАНИЯ -->
        <div class="schedule-card" id="scheduleCard">
            <div class="schedule-header">
                <h1>расписание ✦</h1>
                <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                    <span class="group-name" id="groupName">310Р15</span>
                    <span class="count-badge" id="pairCount">0 пар</span>
                </div>
            </div>

            <div class="table-wrap">
                <div id="scheduleContent">
                    <table>
                        <thead>
                            <tr><th>день</th><th>время</th><th>предмет / преподаватель</th><th>ауд.</th></tr>
                        </thead>
                        <tbody id="scheduleBody">
                            <tr>
                                <td colspan="4" style="text-align:center;color:#95486b;padding:1.5rem;">
                                    🖼️ Загрузите фото расписания для распознавания
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="footer-actions">
                <button class="btn btn-success" id="exportBtn">💾 Сохранить как JSON</button>
                <button class="btn btn-danger" id="resetBtn">🔄 Сбросить на демо</button>
            </div>
        </div>
    </div>

    <script>
        // ===== ДЕМО-ДАННЫЕ =====
        const demoData = [
            { day: 'Пн', time: '2 (10:45–12:20)', subject: 'Учебная практика ПМ.02', teacher: 'Демченко Е.В.', room: '9' },
            { day: 'Пн', time: '3 (12:40–14:15)', subject: 'Фотограф', teacher: 'Радюк Л.А.', room: 'ф/л' },
            { day: 'Пн', time: '4 (14:30–16:05)', subject: 'Учебная практика ПМ.05', teacher: 'Радюк Л.А.', room: 'ф/л' },
            { day: 'Вт', time: '1 (09:00–10:35)', subject: 'Производство рекламного продукта', teacher: 'Доманов М.В.',
            room: '16' },
            { day: 'Вт', time: '2 (10:45–12:20)', subject: 'Русский язык и культура речи', teacher: 'Сыромолот Е.Н.',
                room: '18' },
            { day: 'Вт', time: '3 (12:40–14:15)', subject: 'Художественное проектирование рекламного продукта',
                teacher: 'Черноусенко М.В.', room: '15' },
            { day: 'Ср', time: '1 (09:00–10:35)', subject: 'Иностранный язык в профессиональной деятельности',
                teacher: 'Гуца С.К. / Глинская И.В.', room: '3/20' },
            { day: 'Ср', time: '2 (10:45–12:20)', subject: 'Разработка и реализация творческой концепции рекламного продукта',
                teacher: 'Доманов М.В.', room: '15' },
            { day: 'Ср', time: '3 (12:40–14:15)', subject: 'Учебная практика ПМ.04', teacher: 'Доманов М.В.', room: '19' },
            { day: 'Чт', time: '4 (14:30–16:05)', subject: 'Организация и проведение рекламных и коммуникационных кампаний',
                teacher: 'Демченко Е.В.', room: '9' },
            { day: 'Чт', time: '5 (16:10–17:45)', subject: 'Медиапланирование и медиабайт', teacher: 'Гречанова А.В.',
                room: '5a' },
            { day: 'Пт', time: '1 (09:00–10:35)', subject: 'Организация и проведение рекламных и коммуникационных кампаний',
                teacher: 'Демченко Е.В.', room: '9' },
            { day: 'Пт', time: '2 (10:45–12:20)', subject: 'Медиапланирование и медиабайт', teacher: 'Гречанова А.В.',
                room: '5a' },
            { day: 'Пт', time: '3 (12:40–14:15)', subject: 'Физическая культура', teacher: 'Ятрушева О.В.', room: 'ф/з' }
        ];

        let currentSchedule = [...demoData];
        let currentImageFile = null;
        let currentImageUrl = null;
        let isProcessing = false;

        // ===== DOM ЭЛЕМЕНТЫ =====
        const fileInputs = document.querySelectorAll('.upload-btn input[type="file"]');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const recognizeBtn = document.getElementById('recognizeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const scheduleBody = document.getElementById('scheduleBody');
        const pairCount = document.getElementById('pairCount');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const statusMessage = document.getElementById('statusMessage');
        const recognizedText = document.getElementById('recognizedText');
        const textContent = document.getElementById('textContent');

        // ===== ОТРИСОВКА ТАБЛИЦЫ =====
        function renderSchedule(data) {
            if (!data || data.length === 0) {
                scheduleBody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center;color:#95486b;padding:1.5rem;">
                            📭 Расписание пусто
                        </td>
                    </tr>
                `;
                pairCount.textContent = '0 пар';
                return;
            }

            let html = '';
            let currentDay = '';
            let isFirst = true;

            data.forEach((row, index) => {
                const showDay = row.day !== currentDay;
                currentDay = row.day;

                html += `
                    <tr>
                        ${showDay ? `<td class="day-cell"><span>${row.day}</span></td>` : `<td class="day-cell" style="background:transparent !important;border-radius:0;"></td>`}
                        <td><span class="pair-time">${row.time}</span></td>
                        <td>
                            <span class="subject">${row.subject}</span>
                            <span class="teacher">${row.teacher}</span>
                        </td>
                        <td><span class="room">${row.room}</span></td>
                    </tr>
                `;
            });

            scheduleBody.innerHTML = html;
            pairCount.textContent = `${data.length} пар`;
        }

        // ===== ПОКАЗ СТАТУСА =====
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
        }

        function hideStatus() {
            statusMessage.className = 'status-message';
        }

        // ===== ОБНОВЛЕНИЕ ПРОГРЕССА =====
        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressText.textContent = text;
        }

        // ===== ПАРСИНГ РАСПИСАНИЯ ИЗ ТЕКСТА =====
        function parseScheduleFromText(text) {
            const lines = text.split('\n').filter(line => line.trim().length > 0);
            const result = [];

            const dayMap = {
                'понедельник': 'Пн',
                'вторник': 'Вт',
                'среда': 'Ср',
                'четверг': 'Чт',
                'пятница': 'Пт',
                'суббота': 'Сб',
                'воскресенье': 'Вс',
                'пн': 'Пн',
                'вт': 'Вт',
                'ср': 'Ср',
                'чт': 'Чт',
                'пт': 'Пт',
                'сб': 'Сб',
                'вс': 'Вс'
            };

            let currentDay = '';
            let buffer = [];

            for (let line of lines) {
                line = line.trim();

                // Проверяем, не является ли строка днём недели
                const lowerLine = line.toLowerCase();
                let foundDay = null;
                for (const [key, value] of Object.entries(dayMap)) {
                    if (lowerLine.includes(key) || lowerLine === key) {
                        foundDay = value;
                        break;
                    }
                }

                if (foundDay) {
                    // Сохраняем накопленные строки как одну запись
                    if (buffer.length > 0 && currentDay) {
                        const parsed = parseScheduleLine(buffer.join(' '), currentDay);
                        if (parsed) result.push(parsed);
                    }
                    currentDay = foundDay;
                    buffer = [];
                    continue;
                }

                // Пытаемся распарсить строку с номером пары и временем
                const timeMatch = line.match(/(\d+)\s*\((\d{2}:\d{2})[–-](\d{2}:\d{2})\)/);
                if (timeMatch) {
                    // Сохраняем предыдущий буфер
                    if (buffer.length > 0 && currentDay) {
                        const parsed = parseScheduleLine(buffer.join(' '), currentDay);
                        if (parsed) result.push(parsed);
                    }
                    buffer = [line];
                    continue;
                }

                // Если есть номер пары в начале
                const pairMatch = line.match(/^(\d+)\s*[.)]\s*(.+)/);
                if (pairMatch && currentDay) {
                    if (buffer.length > 0) {
                        const parsed = parseScheduleLine(buffer.join(' '), currentDay);
                        if (parsed) result.push(parsed);
                    }
                    buffer = [line];
                    continue;
                }

                // Добавляем строку в буфер
                buffer.push(line);
            }

            // Обрабатываем последний буфер
            if (buffer.length > 0 && currentDay) {
                const parsed = parseScheduleLine(buffer.join(' '), currentDay);
                if (parsed) result.push(parsed);
            }

            return result;
        }

        function parseScheduleLine(line, day) {
            // Ищем время в формате "1 (09:00-10:35)" или "2 (10:45–12:20)"
            let timeMatch = line.match(/(\d+)\s*\((\d{2}:\d{2})[–-](\d{2}:\d{2})\)/);
            if (!timeMatch) {
                // Пробуем другой формат: "1. 09:00-10:35"
                timeMatch = line.match(/(\d+)[.)]\s*(\d{2}:\d{2})[–-](\d{2}:\d{2})/);
                if (timeMatch) {
                    return {
                        day: day,
                        time: `${timeMatch[1]} (${timeMatch[2]}–${timeMatch[3]})`,
                        subject: line.replace(timeMatch[0], '').trim() || '—',
                        teacher: '—',
                        room: '—'
                    };
                }
                // Если нет времени, пропускаем
                return null;
            }

            const pairNum = timeMatch[1];
            const timeStart = timeMatch[2];
            const timeEnd = timeMatch[3];
            const timeStr = `${pairNum} (${timeStart}–${timeEnd})`;

            // Убираем время из строки
            let rest = line.replace(timeMatch[0], '').trim();

            // Ищем аудиторию (цифры или буквы с цифрами, или ф/л, ф/з)
            let roomMatch = rest.match(/\b(ф\/[лз]|\d+[a-zA-Z]?|[a-zA-Z]\/\d+)\b/);
            let room = '—';
            let subjectTeacher = rest;

            if (roomMatch) {
                room = roomMatch[1];
                subjectTeacher = rest.replace(roomMatch[0], '').trim();
            }

            // Пытаемся разделить на предмет и преподавателя
            let subject = subjectTeacher;
            let teacher = '—';

            // Ищем ФИО с инициалами
            const teacherMatch = subjectTeacher.match(/\s*([А-ЯЁ][а-яё]+\s+[А-ЯЁ]\.\s*[А-ЯЁ]\.?)/);
            if (teacherMatch) {
                teacher = teacherMatch[1].trim();
                subject = subjectTeacher.replace(teacherMatch[0], '').trim();
            }

            // Убираем лишние разделители
            subject = subject.replace(/^[–—\-:;,\s]+/, '');

            return {
                day: day,
                time: timeStr,
                subject: subject || '—',
                teacher: teacher || '—',
                room: room || '—'
            };
        }

        // ===== РАСПОЗНАВАНИЕ =====
        async function recognizeSchedule() {
            if (!currentImageFile || isProcessing) return;

            isProcessing = true;
            recognizeBtn.disabled = true;
            hideStatus();

            progressContainer.classList.add('active');
            updateProgress(0, 'Подготовка...');

            try {
                const imageUrl = URL.createObjectURL(currentImageFile);

                // Показываем предпросмотр
                previewImage.src = imageUrl;
                previewContainer.classList.add('active');

                // Распознаём текст
                const result = await Tesseract.recognize(imageUrl, 'rus', {
                    logger: (m) => {
                        if (m.status === 'recognizing text') {
                            const progress = Math.round(m.progress * 100);
                            updateProgress(progress, `Распознавание: ${progress}%`);
                        }
                    }
                });

                const text = result.data.text;
                textContent.textContent = text;
                recognizedText.classList.add('active');

                updateProgress(100, 'Готово!');

                // Парсим расписание
                const parsed = parseScheduleFromText(text);

                if (parsed.length === 0) {
                    showStatus('⚠️ Не удалось распознать расписание. Попробуйте другое фото или проверьте качество.', 'error');
                } else {
                    currentSchedule = parsed;
                    renderSchedule(parsed);
                    showStatus(`✅ Распознано ${parsed.length} пар!`, 'success');
                }

            } catch (error) {
                console.error(error);
                showStatus('❌ Ошибка распознавания: ' + error.message, 'error');
            } finally {
                isProcessing = false;
                recognizeBtn.disabled = false;
                setTimeout(() => {
                    progressContainer.classList.remove('active');
                }, 2000);
            }
        }

        // ===== ОБРАБОТКА ФАЙЛА =====
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('📷 Пожалуйста, выберите изображение');
                return;
            }

            currentImageFile = file;
            currentImageUrl = URL.createObjectURL(file);

            // Показываем превью
            previewImage.src = currentImageUrl;
            previewContainer.classList.add('active');

            recognizeBtn.disabled = false;
            hideStatus();
            recognizedText.classList.remove('active');
            progressContainer.classList.remove('active');
        }

        // ===== ОЧИСТКА =====
        function clearAll() {
            if (currentImageUrl) {
                URL.revokeObjectURL(currentImageUrl);
            }
            currentImageFile = null;
            currentImageUrl = null;
            previewContainer.classList.remove('active');
            previewImage.src = '';
            recognizeBtn.disabled = true;
            hideStatus();
            recognizedText.classList.remove('active');
            textContent.textContent = '';
            progressContainer.classList.remove('active');
            fileInputs.forEach(input => input.value = '');
        }

        // ===== ЭКСПОРТ JSON =====
        function exportJSON() {
            const data = {
                group: '310Р15',
                schedule: currentSchedule
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'schedule.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ===== СОБЫТИЯ =====

        // Выбор файла
        fileInputs.forEach(input => {
            input.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    handleFile(this.files[0]);
                }
                this.value = '';
            });
        });

        // Распознать
        recognizeBtn.addEventListener('click', recognizeSchedule);

        // Очистить
        clearBtn.addEventListener('click', clearAll);

        // Сброс на демо
        resetBtn.addEventListener('click', function() {
            currentSchedule = [...demoData];
            renderSchedule(currentSchedule);
            clearAll();
            showStatus('🔄 Восстановлено демо-расписание', 'info');
            setTimeout(hideStatus, 3000);
        });

        // Экспорт JSON
        exportBtn.addEventListener('click', exportJSON);

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        renderSchedule(demoData);
    </script>
</body>
